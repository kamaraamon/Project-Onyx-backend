name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx
          POSTGRES_DB: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://onyx:onyx@127.0.0.1:5432/onyx
      DIRECT_URL: postgresql://onyx:onyx@127.0.0.1:5432/onyx
      SESSION_SECRET: ci-session-secret-value
      ADMIN_BOOTSTRAP_EMAIL: admin@example.com
      ADMIN_BOOTSTRAP_PASSWORD: ci-bootstrap-pass
      PAYMENT_PROVIDER: mock
      PAYMENT_MODE: none
      REGISTRATION_MODE: invite_only
      BETA_MAX_USERS: "5"
      LEGAL_REVIEW_DONE: "false"
      CRON_SECRET: ci-cron-secret-value
      TOTP_ENCRYPTION_KEY: ci-totp-key-value-1
      INVITATION_TTL_DAYS: "7"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @onyx/db exec prisma validate --schema prisma/schema.prisma
      - run: pnpm --filter @onyx/db exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan full history
        run: /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
